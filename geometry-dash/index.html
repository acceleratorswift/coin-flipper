<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Geometry Dash Lite</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #05070d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #wrap { position: relative; width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; background: #0a3fa8; cursor: pointer; }
  .back {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    color: #fff; text-decoration: none; font-size: .9rem;
    padding: .4rem .8rem; border-radius: 999px;
    background: rgba(0, 0, 0, .35);
  }
  .back:hover { background: rgba(0, 0, 0, .55); }
</style>
</head>
<body>
  <div id="wrap">
    <a class="back" href="../">← Games</a>
    <canvas id="c"></canvas>
  </div>

<script src="physics.js"></script>
<script src="level.js"></script>
<script>
(() => {
  const W = 800, H = 450;          // logical canvas size
  const U = 40;                    // pixels per world unit
  const GROUND = H - 90;           // screen y of the ground line
  const PLAYER_X = 190;            // screen x of the cube's left edge
  const DT = 1 / 120;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const level = GDLevel;

  let state = 'ready';             // ready | play | dead | win
  let player, held = false, accumulator = 0, last = 0;
  let attempt = 1, best = Number(localStorage.getItem('gd-best') || 0);
  let rot = 0, stateTime = 0, flash = 0, shake = 0;
  let particles = [];

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const progress = () => Math.min(1, Math.max(0, player.x / level.end));

  function reset() {
    player = GDPhysics.newPlayer();
    rot = 0; particles = []; stateTime = 0; flash = 0; shake = 0;
  }

  function begin() {
    if (state === 'win') { attempt = 1; reset(); }
    state = 'play';
  }

  function die() {
    state = 'dead'; stateTime = 0; flash = 1; shake = 1;
    const px = PLAYER_X + 20, py = GROUND - player.y * U - 20;
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 380;
      particles.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120,
        life: 0.7 + Math.random() * 0.5, age: 0, size: 5 + Math.random() * 9, color: i % 3 ? '#f8a30a' : '#2de4ff' });
    }
    best = Math.max(best, Math.floor(progress() * 100));
    localStorage.setItem('gd-best', best);
  }

  function win() {
    state = 'win'; stateTime = 0;
    best = 100; localStorage.setItem('gd-best', best);
    for (let i = 0; i < 90; i++) {
      particles.push({ x: Math.random() * W, y: -10 - Math.random() * 100, vx: (Math.random() - .5) * 120, vy: 80 + Math.random() * 220,
        life: 3, age: 0, size: 6 + Math.random() * 6, color: ['#f8a30a', '#2de4ff', '#fff', '#ff4f7b', '#7dff6a'][i % 5] });
    }
  }

  function press() {
    held = true;
    if (state === 'ready' || state === 'win') begin();
  }
  function release() { held = false; }

  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); press(); }
  });
  window.addEventListener('keyup', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release();
  });

  function update(dt) {
    stateTime += dt;
    if (state === 'play') {
      GDPhysics.step(player, held, level, dt);
      if (player.onGround) {
        const target = Math.round(rot / 90) * 90;
        rot += (target - rot) * Math.min(1, dt * 30);
        if (Math.random() < dt * 40) {
          particles.push({ x: PLAYER_X - 2, y: GROUND - 2, vx: -80 - Math.random() * 60, vy: -30 - Math.random() * 60,
            life: 0.35, age: 0, size: 4 + Math.random() * 3, color: '#f8a30a' });
        }
      } else {
        rot += 330 * dt;
      }
      if (player.dead) die();
      else if (player.won) win();
    } else if (state === 'dead' && stateTime > 0.8) {
      attempt++; reset(); state = 'play';
    }
    for (const p of particles) {
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.life === 3 ? 135 : 900) * dt;
    }
    particles = particles.filter(p => p.age < p.life);
    flash = Math.max(0, flash - dt * 3);
    shake = Math.max(0, shake - dt * 3);
  }

  const wx = x => PLAYER_X + (x - player.x) * U;

  function drawBackground() {
    const hue = 215 + progress() * 130;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${hue}, 85%, 38%)`);
    g.addColorStop(1, `hsl(${hue}, 85%, 22%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const off = (player.x * U * 0.25) % 160;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (let i = -1; i < 7; i++) {
      const x = i * 160 - off;
      ctx.fillRect(x, 60 + (i % 2) * 70, 90, 90);
      ctx.fillRect(x + 80, 220 + (i % 3) * 25, 56, 56);
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    const hue = 215 + progress() * 130;
    g.addColorStop(0, `hsl(${hue}, 80%, 18%)`);
    g.addColorStop(1, `hsl(${hue}, 80%, 10%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 2;
    const off = (player.x * U) % U;
    ctx.beginPath();
    for (let x = -off; x < W; x += U) { ctx.moveTo(x, GROUND); ctx.lineTo(x, H); }
    for (let y = GROUND + U; y < H; y += U) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
    ctx.fillRect(0, GROUND - 2, W, 4);
    ctx.shadowBlur = 0;
  }

  function drawBlock(b) {
    const x = wx(b.x), y = GROUND - (b.y + b.h) * U, w = b.w * U, h = b.h * U;
    if (x > W || x + w < 0) return;
    ctx.fillStyle = '#031a3a';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
    ctx.strokeStyle = '#2de4ff';
    ctx.lineWidth = 2;
    for (let i = 0; i < b.w; i++) for (let j = 0; j < b.h; j++) {
      ctx.strokeRect(x + i * U + 5, y + j * U + 5, U - 10, U - 10);
    }
  }

  function drawSpike(s) {
    const x = wx(s.x), y = GROUND - s.y * U;
    if (x > W || x + U < 0) return;
    ctx.beginPath();
    ctx.moveTo(x + 2, y); ctx.lineTo(x + U / 2, y - U + 2); ctx.lineTo(x + U - 2, y); ctx.closePath();
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 12, y - 2); ctx.lineTo(x + U / 2, y - U + 14); ctx.lineTo(x + U - 12, y - 2); ctx.closePath();
    ctx.fillStyle = 'rgba(45,228,255,.35)';
    ctx.fill();
  }

  function drawPlayer() {
    const cx = PLAYER_X + U / 2, cy = GROUND - player.y * U - U / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot * Math.PI / 180);
    ctx.fillStyle = '#f8a30a';
    ctx.fillRect(-U / 2, -U / 2, U, U);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(-U / 2 + 1.5, -U / 2 + 1.5, U - 3, U - 3);
    ctx.fillStyle = '#2de4ff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.fillRect(-11, -11, 8, 8); ctx.strokeRect(-11, -11, 8, 8);
    ctx.fillRect(3, -11, 8, 8); ctx.strokeRect(3, -11, 8, 8);
    ctx.fillRect(-11, 3, 22, 8); ctx.strokeRect(-11, 3, 22, 8);
    ctx.restore();
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.font = `800 ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = size / 6;
    ctx.strokeStyle = '#000';
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    const bw = 300, bx = (W - bw) / 2, by = 22;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = '#7dff6a';
    ctx.fillRect(bx, by, bw * progress(), 12);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 12);
    text(`${Math.floor(progress() * 100)}%`, bx + bw + 30, by + 6, 20, '#fff', 'left');
    text(`Best ${best}%`, W - 16, 24, 16, '#fff', 'right');
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 14 * shake, (Math.random() - .5) * 14 * shake);
    drawBackground();
    drawGround();
    for (const b of level.blocks) drawBlock(b);
    for (const s of level.spikes) drawSpike(s);

    // finish line
    const fx = wx(level.end);
    if (fx < W + 40) {
      ctx.fillStyle = 'rgba(125,255,106,.35)';
      ctx.fillRect(fx, 0, 80, GROUND);
      ctx.fillStyle = '#7dff6a';
      ctx.fillRect(fx, 0, 4, GROUND);
    }

    if (state !== 'dead') drawPlayer();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (player.x < 10) text(`Attempt ${attempt}`, wx(2) + 120, GROUND - 190, 36);
    drawHUD();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }

    if (state === 'ready') {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
      text('GEOMETRY DASH LITE', W / 2, 140, 52);
      text('Click, tap or press Space to jump', W / 2, 215, 24);
      text('Hold to keep jumping', W / 2, 250, 20, '#2de4ff');
    } else if (state === 'win') {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
      text('LEVEL COMPLETE!', W / 2, 150, 58, '#7dff6a');
      text(`Attempts: ${attempt}`, W / 2, 225, 30);
      if (stateTime > 0.6) text('Click or press Space to play again', W / 2, 285, 22, '#2de4ff');
    }
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000 || 0);
    last = now;
    accumulator += dt;
    while (accumulator >= DT) { update(DT); accumulator -= DT; }
    render();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(t => { last = t; frame(t); });

  window.__gd = { get state() { return state; }, get player() { return player; }, get attempt() { return attempt; } };
})();
</script>
</body>
</html>
