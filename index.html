<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 50% 0%, #2b3a55 0%, #121826 70%) fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem;
  }
  h1 {
    margin: 0 0 3rem;
    font-size: clamp(2.5rem, 9vw, 5rem);
    letter-spacing: .15em;
    text-transform: uppercase;
    text-shadow: 0 4px 24px rgba(0, 0, 0, .5);
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2.5rem;
    max-width: 900px;
  }
  .game {
    width: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .icon {
    width: 200px;
    height: 200px;
    border-radius: 28px;
    overflow: hidden;
    background: rgba(255, 255, 255, .08);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    transition: transform .2s ease, box-shadow .2s ease;
    display: grid;
    place-items: center;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icon.coin img { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .game:hover .icon, .game:focus-visible .icon {
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
  }
  .game:focus-visible { outline: none; }
  .game:focus-visible .icon { outline: 3px solid #fff; }
  .name { font-size: 1.15rem; font-weight: 600; letter-spacing: .04em; text-align: center; }
</style>
</head>
<body>
  <h1>Games</h1>
  <main class="grid">
    <a class="game" href="coin-flip/">
      <span class="icon coin"><img src="assets/coin-icon.png" alt=""></span>
      <span class="name">Coin Flip</span>
    </a>
    <a class="game" href="wordle/">
      <span class="icon"><img src="assets/wordle-icon.png" alt=""></span>
      <span class="name">Unlimited Wordle</span>
    </a>
    <a class="game" href="geometry-dash/">
      <span class="icon"><img src="assets/geometry-dash-icon.png" alt=""></span>
      <span class="name">Geometry Dash Lite</span>
    </a>
  </main>
</body>
</html>
